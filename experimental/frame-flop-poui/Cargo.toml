[package]
name = "pallet-flop-poui-experimental"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame-support = { version = "=43.0.0", default-features = false }
frame-system = { version = "=43.0.0", default-features = false }
sp-io = { version = "=43.0.0", default-features = false }

[dev-dependencies]
hex-literal = "0.4"

[features]
default = ["std"]
std = [
  "codec/std",
  "scale-info/std",
  "frame-support/std",
  "frame-system/std",
  "sp-io/std",
]
