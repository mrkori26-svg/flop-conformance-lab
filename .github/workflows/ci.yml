name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Reproduce downstream Sentinel TCLK drift
        run: python3 conformance/reproductions/noobna-flop-sentinel-tclk.py
      - name: Reproduce downstream Sentinel Sonnet receipt trust gap
        run: python3 conformance/reproductions/noobna-sonnet-receipt-auth.py

  upstream-tclk-trust-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flop-labs/tclk
          ref: 5cc4ab93efbc8999a3a7e1471b639deca25998ea
          path: upstream-tclk
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - name: Install pinned upstream
        working-directory: upstream-tclk
        run: pnpm install --frozen-lockfile
      - name: Build pinned upstream and MCP
        working-directory: upstream-tclk
        run: pnpm build:all
      - name: Reproduce TCLK #93 against pinned upstream
        env:
          TCLK_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-tclk
        run: node conformance/reproductions/tclk-93-upstream.mjs
      - name: Reproduce TCLK #96 against pinned upstream
        env:
          TCLK_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-tclk
        run: node conformance/reproductions/tclk-96-upstream.mjs

  upstream-yellowpaper-wire-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flop-labs/yellowpaper
          ref: cb3cbf97a346ff85aca6dba5e924434270ca672c
          path: upstream-yellowpaper
      - name: Check openagentsearch flop-wire-v1 report against pinned corpus
        env:
          YELLOWPAPER_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-yellowpaper
        run: python3 conformance/reproductions/flop-wire-v1-openagentsearch.py


  external-flop-proof-api-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kberkan/flop-proof-api
          ref: 1672ec5f5536f8ea06934ff2823bf36ad47dd1b6
          path: external-flop-proof-api
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci --ignore-scripts
      - name: Install external verifier crypto dependencies
        run: python -m pip install "cryptography>=43,<48" "base58>=2.1,<3" "py-sr25519-bindings==0.2.4"
      - name: Run external F.1 canonical + mutation corpus
        env:
          FLOP_PROOF_API_F1_REPO: ${{ github.workspace }}/external-flop-proof-api
          FLOP_PROOF_API_F1_PYTHON: python
        run: npm run runtime:proof-api:corpus
      - name: Run external F.1 negative boundary reproduction
        env:
          FLOP_PROOF_API_ROOT: ${{ github.workspace }}/external-flop-proof-api
          FLOP_PROOF_API_COMMIT: 1672ec5f5536f8ea06934ff2823bf36ad47dd1b6
        run: python conformance/reproductions/flop-proof-api-f1-boundaries.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-flop-proof-api-f1-${{ github.run_id }}
          path: .runtime/external-flop-proof-api-f1-corpus.json

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: consumer
        uses: ./
        with:
          profile: technocore-agent
          input: examples/external-consumer/technocore-agent.json
          out: conformance-report.json
      - name: Assert portable result
        run: |
          test -f conformance-report.json
          node -e 'const r=require("./conformance-report.json"); if(!["PASS","PARTIAL"].includes(r.result)) process.exit(2)'
      - name: Upload retained evidence
        uses: actions/upload-artifact@v4
        with:
          name: action-smoke-conformance-report
          path: conformance-report.json
