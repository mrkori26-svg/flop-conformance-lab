name: Runtime Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["Protocol Drift Observatory"]
    types: [completed]

permissions:
  contents: read

jobs:
  reference-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: runtime-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            runtime-state-${{ github.repository }}-
      - run: npm ci
      - run: npm run runtime:cycle
      - run: npm run runtime:status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-reference-f1-${{ github.run_id }}
          path: |
            .runtime/reference-f1-state.json
            runtime-public/runtime-index.json
            runtime-public/STATUS.md
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .runtime
          key: runtime-state-${{ github.repository }}-${{ github.run_id }}
