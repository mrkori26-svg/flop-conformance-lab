name: Runtime Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  reference-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run runtime:f1
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-reference-f1
          path: .runtime/reference-f1-latest.json
