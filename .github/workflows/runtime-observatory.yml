name: Runtime Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["Protocol Drift Observatory"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: runtime-evidence-publisher
  cancel-in-progress: false

jobs:
  reference-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kberkan/flop-proof-api
          ref: 1672ec5f5536f8ea06934ff2823bf36ad47dd1b6
          path: external-flop-proof-api
      - uses: actions/checkout@v4
        with:
          repository: Mabolla/technocore-task-relay
          path: external-task-relay
      - uses: actions/checkout@v4
        with:
          repository: congge918/technocore-tclk-deal-scout
          path: external-deal-scout
      - uses: actions/checkout@v4
        with:
          repository: retardio73-boop/flop-session-router
          path: external-session-router
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: runtime-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            runtime-state-${{ github.repository }}-
      - name: Recover durable state when cache is empty
        shell: bash
        run: |
          mkdir -p .runtime
          git fetch origin runtime-evidence:refs/remotes/origin/runtime-evidence || true
          if [ ! -f .runtime/reference-f1-state.json ]; then
            git show origin/runtime-evidence:.runtime/reference-f1-state.json > .runtime/reference-f1-state.json 2>/dev/null || rm -f .runtime/reference-f1-state.json
          fi
          if [ ! -f .runtime/external-flop-proof-api-f1-state.json ]; then
            git show origin/runtime-evidence:.runtime/external-flop-proof-api-f1-state.json > .runtime/external-flop-proof-api-f1-state.json 2>/dev/null || rm -f .runtime/external-flop-proof-api-f1-state.json
          fi
          if [ ! -f .runtime/external-task-relay-paper-state.json ]; then
            git show origin/runtime-evidence:.runtime/external-task-relay-paper-state.json > .runtime/external-task-relay-paper-state.json 2>/dev/null || rm -f .runtime/external-task-relay-paper-state.json
          fi
          if [ ! -f .runtime/external-deal-scout-state.json ]; then
            git show origin/runtime-evidence:.runtime/external-deal-scout-state.json > .runtime/external-deal-scout-state.json 2>/dev/null || rm -f .runtime/external-deal-scout-state.json
          fi
      - run: npm ci
      - name: Install external deal-scout dependencies
        working-directory: external-deal-scout
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Session Router for external runtime integration
        working-directory: external-session-router
        run: |
          npm ci
          npm run build
      - name: Install external verifier crypto dependencies
        run: python -m pip install "cryptography>=43,<48" "base58>=2.1,<3" "py-sr25519-bindings==0.2.4"
      - run: npm run runtime:cycle
      - name: Run continuous external F.1 verifier cycle
        env:
          FLOP_PROOF_API_F1_REPO: ${{ github.workspace }}/external-flop-proof-api
          FLOP_PROOF_API_F1_PYTHON: python
        run: node dist/src/runtime-cli.js cycle --target external-flop-proof-api-f1 --input examples/external-consumer/direct-rail-f1.json --state .runtime/external-flop-proof-api-f1-state.json --retry-budget 2 --history-limit 744
      - name: Run external canonical + mutation evidence corpus
        env:
          FLOP_PROOF_API_F1_REPO: ${{ github.workspace }}/external-flop-proof-api
          FLOP_PROOF_API_F1_PYTHON: python
        run: node dist/src/external-f1-corpus-cli.js --input examples/external-consumer/direct-rail-f1.json --out .runtime/external-flop-proof-api-f1-corpus.json
      - name: Run continuous external task-relay runtime cycle
        env:
          FLOP_TASK_RELAY_REPO: ${{ github.workspace }}/external-task-relay
          FLOP_SESSION_ROUTER_REPO: ${{ github.workspace }}/external-session-router
        run: node dist/src/runtime-cli.js cycle --target external-task-relay-paper --input examples/external-consumer/task-relay-paper.json --state .runtime/external-task-relay-paper-state.json --retry-budget 1 --history-limit 744
      - name: Run continuous external deal-scout runtime cycle
        env:
          FLOP_DEAL_SCOUT_REPO: ${{ github.workspace }}/external-deal-scout
        run: node dist/src/runtime-cli.js cycle --target external-deal-scout --input examples/external-consumer/deal-scout-readonly.json --state .runtime/external-deal-scout-state.json --retry-budget 1 --history-limit 744
      - run: npm run runtime:status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-reference-f1-${{ github.run_id }}
          retention-days: 90
          path: |
            .runtime/reference-f1-state.json
            .runtime/external-flop-proof-api-f1-state.json
            .runtime/external-flop-proof-api-f1-corpus.json
            .runtime/external-task-relay-paper-state.json
            .runtime/external-deal-scout-state.json
            runtime-public/runtime-index.json
            runtime-public/STATUS.md
      - name: Publish durable public evidence branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin runtime-evidence:refs/remotes/origin/runtime-evidence || true
          rm -rf /tmp/runtime-evidence-worktree
          if git show-ref --verify --quiet refs/remotes/origin/runtime-evidence; then
            git worktree add --detach /tmp/runtime-evidence-worktree origin/runtime-evidence
          else
            git worktree add --detach /tmp/runtime-evidence-worktree HEAD
          fi
          mkdir -p /tmp/runtime-evidence-worktree/.runtime /tmp/runtime-evidence-worktree/runtime-public
          cp .runtime/reference-f1-state.json /tmp/runtime-evidence-worktree/.runtime/reference-f1-state.json
          cp .runtime/external-flop-proof-api-f1-state.json /tmp/runtime-evidence-worktree/.runtime/external-flop-proof-api-f1-state.json
          cp .runtime/external-flop-proof-api-f1-corpus.json /tmp/runtime-evidence-worktree/.runtime/external-flop-proof-api-f1-corpus.json
          cp .runtime/external-task-relay-paper-state.json /tmp/runtime-evidence-worktree/.runtime/external-task-relay-paper-state.json
          cp .runtime/external-deal-scout-state.json /tmp/runtime-evidence-worktree/.runtime/external-deal-scout-state.json
          cp runtime-public/runtime-index.json /tmp/runtime-evidence-worktree/runtime-public/runtime-index.json
          cp runtime-public/STATUS.md /tmp/runtime-evidence-worktree/runtime-public/STATUS.md
          cd /tmp/runtime-evidence-worktree
          git add -f .runtime/reference-f1-state.json .runtime/external-flop-proof-api-f1-state.json .runtime/external-flop-proof-api-f1-corpus.json .runtime/external-task-relay-paper-state.json .runtime/external-deal-scout-state.json runtime-public/runtime-index.json runtime-public/STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "evidence: runtime snapshot ${GITHUB_RUN_ID}"
            git push origin HEAD:runtime-evidence
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .runtime
          key: runtime-state-${{ github.repository }}-${{ github.run_id }}
