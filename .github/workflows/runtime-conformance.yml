name: Runtime Conformance Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  reference-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Run reference F.1 runtime target
        run: npm run runtime:f1
      - name: Probe public Volta runtime
        id: volta
        continue-on-error: true
        run: npm run runtime:volta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence
          path: |
            conformance/runtime/reference-f1-latest.json
            conformance/runtime/reference-f1-latest.json.capabilities.json
            conformance/runtime/volta-public-latest.json
            conformance/runtime/volta-public-latest.json.capabilities.json
          if-no-files-found: error
