name: Runtime Conformance Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  reference-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Run reference F.1 runtime target
        run: npm run runtime:f1
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-reference-f1
          path: conformance/runtime/reference-f1-latest.json
          if-no-files-found: error
