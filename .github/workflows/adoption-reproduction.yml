name: External adoption reproduction

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: external-adoption-reproduction
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Reproduce known merged external integrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLOP_LAB_ROOT: ${{ github.workspace }}
        run: node tools/adoption-reproduce-known.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoption-reproduction
          path: reports/adoption-reproduction.json
      - name: Detect ledger update
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- adoption/external-evidence-reuse.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open promotion PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/external-adoption"
          if [ "$(gh pr list --state open --head "$branch" --json number --jq 'length')" != "0" ]; then
            echo "An adoption promotion PR is already open; leaving the new reproduction artifact for review."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add adoption/external-evidence-reuse.json
          git commit -m "adoption: record verified external dependency"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch"             --title "adoption: record verified external dependency"             --body "Automated promotion after a merged external integration was independently reproduced from its immutable merge commit. The ledger records only verified DEPENDENCY evidence; merge alone never promotes adoption."
