name: FLOP Verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [settlement-binding, transcript-completeness, venue-time]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run verification check
        shell: bash
        run: |
          set +e
          node dist/src/flop-verify-cli.js --check "$CHECK" --out "flop-verify-$CHECK.json"
          code=$?
          test "$code" -eq 0 -o "$code" -eq 1
        env:
          CHECK: ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        with:
          name: flop-verify-${{ matrix.check }}
          path: flop-verify-${{ matrix.check }}.json
